<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - QA Playground</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>QA Playground - Login</h1>
  </header>

  <main class="container">
    <form id="login-form" class="card">
      <h2>Iniciar sesión</h2>

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" required placeholder="test@example.com">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required placeholder="********">
      </div>

      <p id="login-error" class="error" hidden>Credenciales inválidas. Usa: test@example.com / 1234</p>

      <button type="submit" class="btn">Entrar</button>

      <p class="hint">Usuario de prueba: <strong>test@example.com</strong> / <strong>1234</strong></p>
    </form>
  </main>

  <script src="auth.js"></script>
</body>
</html>
